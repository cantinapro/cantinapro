<title>CantinaPro — Bar Management App</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#080810;--s1:#12121e;--s2:#1c1c2e;--s3:#26263a;--border:#3a3a55;--gold:#f5a623;--amber:#e8820c;--red:#ff4455;--green:#00e87a;--blue:#4d9fff;--purple:#b366ff;--teal:#00d4aa;--text:#f0f0ff;--muted:#9999bb;--lc:#c8102e;--lcg:#d4a017;}
html,body{height:100%;width:100%;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow-x:hidden;font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
#root{min-height:100vh;}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;position:relative;}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.auth-logo{font-family:'Bebas Neue',cursive;font-size:56px;letter-spacing:8px;color:var(--lc);line-height:1;}
.auth-sub{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:3px;color:var(--lcg);margin-top:6px;}
.auth-div{width:60px;height:2px;background:linear-gradient(90deg,var(--lc),var(--lcg));margin:20px auto;}
.auth-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:400px;}
.auth-title{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:3px;margin-bottom:20px;color:var(--text);}
.auth-tabs{display:flex;background:var(--s2);border-radius:8px;overflow:hidden;margin-bottom:20px;}
.auth-tab{flex:1;padding:12px;border:none;background:none;color:var(--muted);font-family:'Bebas Neue',cursive;font-size:15px;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.auth-tab.on{background:linear-gradient(135deg,var(--lc),#a00020);color:#fff;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.field input,.field select,.field textarea{background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:13px 14px;font-size:16px;font-family:'Rajdhani',sans-serif;outline:none;width:100%;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--lc);}
.field textarea{resize:vertical;min-height:70px;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:52px;}
.pw-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:4px;line-height:1;}
.auth-btn{width:100%;padding:16px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--lc),#a00020);color:#fff;font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:3px;cursor:pointer;margin-top:6px;-webkit-appearance:none;}
.auth-btn:disabled{opacity:.6;}
.auth-err{background:rgba(255,68,85,.12);border:1px solid rgba(255,68,85,.4);border-radius:8px;padding:12px;font-size:15px;color:var(--red);margin-bottom:14px;}

/* PIN */
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;}
.pin-btn{padding:20px;border:1px solid var(--border);border-radius:12px;background:var(--s2);color:var(--text);font-family:'Bebas Neue',cursive;font-size:26px;cursor:pointer;text-align:center;-webkit-appearance:none;}
.pin-display{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;font-family:'Share Tech Mono',monospace;font-size:32px;letter-spacing:10px;margin-bottom:6px;min-height:62px;color:var(--lc);}
.staff-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.staff-sel-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;text-align:center;}

/* HEADER */
.hdr{background:var(--s1);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;}
.hdr-logo{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:4px;color:var(--lc);}
.hdr-bar{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--lcg);letter-spacing:1px;}
.hdr-r{display:flex;align-items:center;gap:8px;}
.lang-wrap{display:flex;background:var(--s2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.lb{background:none;border:none;color:var(--muted);font-family:'Bebas Neue',cursive;font-size:13px;padding:5px 9px;cursor:pointer;}
.lb.on{background:linear-gradient(135deg,var(--lc),#a00020);color:#fff;}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:'Bebas Neue',cursive;font-size:11px;padding:5px 8px;border-radius:4px;cursor:pointer;}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
.staff-badge{background:rgba(212,160,23,.2);border:1px solid rgba(212,160,23,.4);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--lcg);font-family:'Share Tech Mono',monospace;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* TOP NAV (horizontal scroll) */
.top-nav{background:var(--s1);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;overflow-y:hidden;position:sticky;top:58px;z-index:90;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;}
.top-nav::-webkit-scrollbar{display:none;}
.nb{background:none;border:none;color:var(--muted);font-family:'Rajdhani',sans-serif;flex-shrink:0;padding:11px 16px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:3px solid transparent;transition:color .2s,border-color .2s;position:relative;-webkit-tap-highlight-color:transparent;min-width:64px;}
.nb.on{color:var(--lc);border-bottom-color:var(--lc);}
.ni{font-size:19px;line-height:1;}
.nl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:inherit;white-space:nowrap;}
.nbadge{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;font-size:9px;border-radius:8px;padding:1px 5px;font-weight:700;line-height:1.3;}

/* MAIN */
.main{flex:1;padding:16px;padding-bottom:24px;overflow-y:auto;}
.sec-title{font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:3px;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}
.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.ct{font-family:'Bebas Neue',cursive;font-size:15px;letter-spacing:2px;color:var(--muted);margin-bottom:14px;}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.kpi.lc::before{background:linear-gradient(90deg,var(--lc),var(--lcg));}
.kpi.g::before{background:var(--green);}
.kpi.r::before{background:var(--red);}
.kpi.b::before{background:var(--blue);}
.kl{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.kv{font-family:'Bebas Neue',cursive;font-size:32px;letter-spacing:2px;line-height:1;}
.kpi.lc .kv{color:var(--lc);}
.kpi.g .kv{color:var(--green);}
.kpi.r .kv{color:var(--red);}
.kpi.b .kv{color:var(--blue);}
.kd{font-size:12px;color:var(--muted);margin-top:2px;}

/* BUTTONS */
.action-btn{width:100%;padding:14px;border:none;border-radius:10px;font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:2px;cursor:pointer;margin-top:8px;display:block;text-align:center;-webkit-appearance:none;}
.action-btn.red{background:linear-gradient(135deg,var(--lc),#a00020);color:#fff;}
.action-btn.green{background:linear-gradient(135deg,var(--green),#00a050);color:#000;}
.action-btn.blue{background:linear-gradient(135deg,var(--blue),#2266cc);color:#fff;}
.action-btn.purple{background:linear-gradient(135deg,var(--purple),#7722cc);color:#fff;}
.action-btn.gold{background:linear-gradient(135deg,var(--gold),var(--amber));color:#000;}
.action-btn:disabled{opacity:.5;}
.btn-sm{padding:8px 14px;border:none;border-radius:6px;font-family:'Bebas Neue',cursive;font-size:12px;letter-spacing:1px;cursor:pointer;-webkit-appearance:none;}

/* ROWS */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}

/* INVENTORY */
.inv-table{width:100%;border-collapse:collapse;}
.inv-table th{font-size:10px;letter-spacing:1px;color:var(--muted);padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);text-transform:uppercase;}
.inv-table td{padding:11px 8px;border-bottom:1px solid var(--border);font-size:14px;}
.inv-table tr:last-child td{border-bottom:none;}
.stock-pill{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.stock-ok{background:#0d3320;color:var(--green);}
.stock-low{background:#3d1800;color:#ff9040;}
.stock-out{background:#2d0008;color:var(--red);}

/* CHECKLIST */
.cprog{background:var(--s2);border-radius:4px;overflow:hidden;height:7px;margin-bottom:12px;}
.cbar{height:100%;background:var(--green);border-radius:4px;transition:width .3s;}
.cgroup-t{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;margin-top:14px;font-weight:700;}
.citem{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.citem:last-child{border-bottom:none;}
.cbox{width:26px;height:26px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.cbox.done{background:var(--green);border-color:var(--green);}
.ctxt{font-size:15px;font-weight:500;}
.ctxt.done{color:var(--muted);text-decoration:line-through;}
.subbtn{width:100%;padding:16px;border-radius:8px;border:none;font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:2px;cursor:pointer;margin-top:14px;-webkit-appearance:none;}
.subbtn.ready{background:var(--gold);color:#000;}
.subbtn.locked{background:var(--s2);color:var(--muted);border:1px solid var(--border);}

/* GALLERY */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pcard{border-radius:10px;overflow:hidden;border:1px solid var(--border);aspect-ratio:1;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--s2);}
.pcard img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.photo-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:10px;}
.photo-label{font-size:11px;color:#fff;font-weight:700;}
.photo-time{font-size:10px;color:rgba(255,255,255,.7);font-family:'Share Tech Mono',monospace;}
.upzone{border:2px dashed var(--border);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;margin-bottom:14px;}

/* MISC */
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--lc);border-radius:50%;animation:spin 1s linear infinite;margin:14px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:32px 16px;color:var(--muted);font-size:15px;line-height:1.8;}
.success-box{background:rgba(0,232,122,.1);border:1px solid rgba(0,232,122,.4);border-radius:10px;padding:16px;text-align:center;font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:2px;color:var(--green);margin-bottom:14px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-end;justify-content:center;z-index:1000;}
.modal{background:var(--s2);border:1px solid var(--border);border-top-left-radius:20px;border-top-right-radius:20px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;}
.modal-title{font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:2px;margin-bottom:18px;color:var(--text);}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions button{flex:1;padding:14px;border-radius:8px;font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:1px;border:none;cursor:pointer;}
.btn-cancel{background:var(--s3);color:var(--muted);}
.btn-save{background:var(--lc);color:#fff;}

/* SCHEDULE */
.day-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--s2);color:var(--muted);font-family:'Bebas Neue',cursive;font-size:12px;cursor:pointer;text-align:center;min-width:52px;-webkit-appearance:none;}
.day-tab.on{background:var(--lc);border-color:var(--lc);color:#fff;}
.day-tab.has-open{border-color:var(--red);color:var(--red);}
.shift-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.shift-card.open{border-color:rgba(255,68,85,.5);background:rgba(255,68,85,.06);}
.shift-card.covered{border-color:rgba(0,232,122,.4);background:rgba(0,232,122,.05);}
.shift-card.mine{border-color:rgba(212,160,23,.5);background:rgba(212,160,23,.05);}
.shift-time{font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:2px;color:var(--text);}
.shift-role{font-size:13px;color:var(--muted);text-transform:uppercase;margin-top:3px;}
.shift-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block;margin-top:8px;}
.shift-badge.scheduled{background:rgba(77,159,255,.2);color:var(--blue);}
.shift-badge.open{background:rgba(255,68,85,.2);color:var(--red);}
.shift-badge.covered{background:rgba(0,232,122,.2);color:var(--green);}
.shift-badge.mine{background:rgba(212,160,23,.2);color:var(--lcg);}
.bid-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.bid-row:last-child{border-bottom:none;}
.open-banner{background:rgba(255,68,85,.1);border:1px solid rgba(255,68,85,.3);border-radius:10px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
.staff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.staff-pick{background:var(--s2);border:2px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;}
.staff-pick.on{background:rgba(200,16,46,.12);border-color:var(--lc);}
.clock-wrap{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;}
.lct{font-family:'Bebas Neue',cursive;font-size:48px;letter-spacing:4px;color:var(--lc);line-height:1;}
.lcd{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted);margin-top:6px;}
.my-shift-highlight{background:rgba(212,160,23,.1);border:2px solid rgba(212,160,23,.4);border-radius:10px;padding:16px;margin-bottom:14px;text-align:center;}
.link-box{background:var(--s2);border:2px solid var(--lcg);border-radius:10px;padding:14px;margin-bottom:10px;}
.link-url{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--lcg);word-break:break-all;margin-bottom:12px;line-height:1.6;}
.install-banner{background:rgba(77,159,255,.1);border:1px solid rgba(77,159,255,.3);border-radius:10px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
</style>

async function init(){
  try{
    setInterval(()=>{
      S.liveTime=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const el=document.getElementById('clock-el');if(el)el.textContent=S.liveTime;
    },1000);
    const urlBarId=getBarIdFromURL();
    if(urlBarId){
      S.urlBarId=urlBarId;
      const{data:bar,error:barError}=await db.from('bars').select('*').eq('id',urlBarId).maybeSingle();
      if(barError){console.error('[CantinaPro] bar lookup error:',barError);S.barLookupError=barError.message;}
      if(bar){
        S.bar=bar;
        const{data:staff,error:staffError}=await db.from('staff').select('*').eq('bar_id',urlBarId).order('name');
        if(staffError)console.error('[CantinaPro] staff lookup error:',staffError);
        S.staffLoginStaff=staff||[];
      }else if(!barError){
        S.barLookupError='not_found';
      }
      S.appLoading=false;render();return;
    }
    const{data:{session}}=await db.auth.getSession();
    if(session){S.user=session.user;await loadBar();}
    S.appLoading=false;render();
    db.auth.onAuthStateChange(async(_,session)=>{
      if(session){S.user=session.user;await loadBar();}
      else if(!S.staffUser){S.user=null;S.bar=null;}
      render();
    });
  }catch(e){
    console.error('[CantinaPro] init crashed:',e);
    S.appLoading=false;
    document.getElementById('root').innerHTML=`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'Rajdhani',sans-serif;color:#f0f0ff;background:#080810">
      <div style="font-family:'Bebas Neue',cursive;font-size:42px;letter-spacing:6px;color:#c8102e">CANTINAPRO</div>
      <div style="font-size:16px;color:#9999bb;margin-top:24px;max-width:380px;line-height:1.6">Something went wrong loading the app. Please refresh the page or check your internet connection.</div>
      <button onclick="location.reload()" style="margin-top:24px;padding:14px 28px;background:linear-gradient(135deg,#c8102e,#a00020);border:none;border-radius:8px;color:#fff;font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:2px;cursor:pointer">RELOAD</button>
      <div style="font-size:12px;color:#666;margin-top:16px;font-family:'Share Tech Mono',monospace">${e.message||''}</div>
    </div>`;
  }
}

function pinPress(v){
  if(S.staffPinVerifying)return;
  if(v==='del')S.staffPinInput=S.staffPinInput.slice(0,-1);
  else if(S.staffPinInput.length<4)S.staffPinInput+=v;
  render();
  if(S.staffPinInput.length===4){
    S.staffPinVerifying=true;
    setTimeout(()=>{render();verifyPin();},150);
  }

async function verifyPin(){
  const m=S.staffLoginSelected;
  if(!m.pin||m.pin.toString()===S.staffPinInput.toString()){
    try{
      S.staffUser=m;
      await loadSchedules();await loadStaff();await loadMessages();
      subscribeToMessages();
      S.tab='my-schedule';S.staffPinError='';S.staffPinVerifying=false;
    }catch(e){
      console.error('[CantinaPro] verifyPin load error:',e);
      S.staffPinError='Could not load. Check your connection.';
      S.staffUser=null;S.staffPinInput='';S.staffPinVerifying=false;
    }
  }else{
    S.staffPinError=S.lang==='es'?'PIN incorrecto. Intenta de nuevo.':'Wrong PIN. Try again.';

  }

  else{S.bar=null;S.staffLoginStaff=[];S.staffLoginStep='select';S.staffLoginSelected=null;S.staffPinInput='';S.schedules=[];S.bids=[];S.staff=[];S.checklist={};S.closeoutSubmitted=false;}

async function handleAuth(){
  S.authError='';S.authLoading=true;render();
  const email=S.loginEmail.trim(),password=S.loginPassword.trim();
  if(!email||!password){S.authError='Email and password are required';S.authLoading=false;render();return;}
  if(S.authMode==='login'){
    const{error}=await db.auth.signInWithPassword({email,password});
    if(error){S.authError=error.message;S.authLoading=false;render();return;}
  }else{
    if(!S.loginBarName.trim()){S.authError='Bar name is required';S.authLoading=false;render();return;}
    const{data,error}=await db.auth.signUp({email,password});
    if(error){S.authError=error.message;S.authLoading=false;render();return;}
    if(data.user){
      await db.from('bars').insert({name:S.loginBarName.trim(),location:S.loginLocation.trim(),owner_email:email});
      S.onboardingStep=1;
    }
  }
  S.authLoading=false;render();
}
async function logout(){
  try{
    if(_chatSub){await db.removeChannel(_chatSub);_chatSub=null;}
    await db.auth.signOut();
  }catch(e){console.error('[CantinaPro] logout error:',e);}
  Object.assign(S,{
    user:null,bar:null,staff:[],sales:[],inventory:[],photos:[],schedules:[],
    bids:[],checklist:{},closeoutSubmitted:false,clockedIn:[],selectedStaff:null,
    staffUser:null,messages:[],chatInput:'',onboardingStep:0,
    tab:'dashboard',selectedPhoto:null,selectedItem:null,
    loginEmail:'',loginPassword:'',loginBarName:'',loginLocation:'',authMode:'login',authError:''
  });
  render();
}

async function sendMessage(){
  const txt=(S.chatInput||'').trim();
  if(!txt||!S.bar)return;
  const sender=S.staffUser?S.staffUser.name:'Owner';
  const senderId=S.staffUser?S.staffUser.id:(S.user?.id||'owner');
  const isOwner=!S.staffUser;
  S.chatInput='';
  const inputEl=document.getElementById('chat-input');if(inputEl){inputEl.value='';inputEl.style.height='auto';}
  const{data,error}=await db.from('messages').insert({
    bar_id:S.bar.id,sender_name:sender,sender_id:senderId,
    is_owner:isOwner,text:txt,pinned:false
  }).select();
  if(error){console.error('[CantinaPro] sendMessage error:',error);alert('Could not send: '+error.message);return;}
  console.log('[CantinaPro] message sent:',data);
  await loadMessages();render();scrollChatToBottom();
}

let _chatSub=null;
function subscribeToMessages(){
  if(_chatSub){db.removeChannel(_chatSub);_chatSub=null;}
  if(!S.bar)return;
  _chatSub=db.channel(`messages-${S.bar.id}`)
    .on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:`bar_id=eq.${S.bar.id}`},
      async()=>{await loadMessages();if(S.tab==='chat'||S.tab==='staff-chat'){render();scrollChatToBottom();}})
    .subscribe();
}

function shareStaffLink(channel){
  const link=getStaffLink();
  const msg=`You're invited to ${S.bar.name}'s staff portal! Tap this link, pick your name, and enter your PIN to clock in and see your schedule: ${link}`;
  if(channel==='sms')window.location.href=`sms:?&body=${encodeURIComponent(msg)}`;
  else if(channel==='whatsapp')window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  else if(channel==='email')window.location.href=`mailto:?subject=${encodeURIComponent(S.bar.name+' Staff Portal')}&body=${encodeURIComponent(msg)}`;
  else if(channel==='copy'){
    navigator.clipboard?.writeText(link).then(()=>{
      const btn=document.getElementById('onboard-copy-btn');
      if(btn){btn.textContent='✓ COPIED!';setTimeout(()=>btn.textContent='📋 COPY LINK',2000);}
    });
  }
}

      ${S.showDropModal?`<div class="modal-bg" onclick="S.showDropModal=false;render()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-title">DROP THIS SHIFT</div>
          <div style="font-size:15px;color:var(--muted);margin-bottom:16px;line-height:1.6">Your shift will open for others to bid. Your manager will be notified.</div>
          <div class="field"><label>Reason for dropping</label><input type="text" value="${S.dropReason}" oninput="S.dropReason=this.value" placeholder="Family emergency, sick, etc."/></div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="S.showDropModal=false;render()">Cancel</button>
            <button class="btn-save" style="background:var(--red)" onclick="dropShift('${S.dropShiftId}')">DROP SHIFT</button>
          </div>
        </div>
      </div>`:''}
    `:''}

    ${S.tab==='staff-shift'?`
      <div class="sec-title">⏰ ${L?'MI TURNO':'MY SHIFT'}</div>
      <div class="clock-wrap"><div class="lct" id="clock-el">${S.liveTime||'--:--:--'}</div><div class="lcd">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} · ${S.bar.name}</div></div>
      ${myTodayShift?`<div class="my-shift-highlight">
        <div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--lcg);margin-bottom:6px">TODAY'S SHIFT</div>
        <div style="font-family:'Bebas Neue',cursive;font-size:34px;letter-spacing:3px;color:var(--text)">${myTodayShift.start_time} – ${myTodayShift.end_time}</div>
        <div style="font-size:15px;color:var(--muted);margin-top:4px">${myTodayShift.role||'Staff'}</div>
      </div>`:`<div style="background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;text-align:center;color:var(--muted);font-size:15px">No shift scheduled for today.<br/>Check Schedule tab for open shifts.</div>`}
      <div class="card">
        ${isClockedIn?`
          <div style="text-align:center;margin-bottom:14px">
            <div style="font-size:14px;color:var(--muted);letter-spacing:1px">STATUS</div>
            <div style="font-family:'Bebas Neue',cursive;font-size:38px;color:var(--green)">● ON CLOCK</div>
          </div>
          <button class="action-btn red" onclick="S.clockedIn=S.clockedIn.filter(id=>id!=='${S.staffUser.id}');render()">⏹ ${L?'FINALIZAR TURNO':'CLOCK OUT'}</button>
        `:`<button class="action-btn green" onclick="S.clockedIn=[...S.clockedIn,'${S.staffUser.id}'];render()">▶ ${L?'INICIAR TURNO':'CLOCK IN'}</button>`}
      </div>
      <div class="card">
        <div class="ct">SHIFT BRIEFING</div>
        <div style="background:rgba(212,160,23,.08);border:1px solid rgba(212,160,23,.2);border-radius:8px;padding:14px;font-size:15px;line-height:1.8;color:var(--text)">${L?'Bienvenidos al turno. Revisen el inventario, atiendan a los clientes con reservación y reporten incidentes al manager.':'Welcome to your shift. Check inventory levels, attend to reservation guests, and report any incidents to the manager.'}</div>
      </div>
    `:''}

    ${S.tab==='staff-chat'?renderChat(false):''}

    ${S.tab==='staff-photos'?`
      <div class="sec-title">📸 ${L?'FOTOS':'PHOTOS'}</div>
      <div class="card">
        <div class="ct">${L?'TOMAR FOTO / SUBIR':'TAKE OR UPLOAD PHOTO'}</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.6">${L?'Sube fotos de recibos, incidentes, o cualquier cosa que necesite atención del manager.':'Upload photos of liquor receipts, incidents, or anything that needs manager attention.'}</div>
        <div class="field"><label>Tag / Category</label>
          <select onchange="S.photoTag=this.value" style="background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:13px 14px;font-size:16px;width:100%;outline:none;-webkit-appearance:none;">
            ${['Liquor Receipt','Beer Receipt','Food Receipt','Incident','Social Media','Other'].map(t=>`<option ${S.photoTag===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>${L?'Descripción':'Description / Notes'}</label><input type="text" value="${S.photoNote}" oninput="S.photoNote=this.value" placeholder="${L?'¿Qué es esta foto?':'What is this photo of?'}"/></div>
        <label style="display:block;cursor:pointer">
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoUpload(event)"/>
          <div class="upzone">
            <div style="font-size:40px;margin-bottom:10px">📷</div>
            <div style="font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:2px;color:var(--muted)">${L?'TOMAR FOTO':'TAKE PHOTO'}</div>
            <div style="font-size:13px;color:var(--muted);margin-top:6px">${L?'o toca para subir desde galería':'or tap to upload from gallery'}</div>
          </div>
        </label>
      </div>
      <div class="photo-grid">
        ${S.photos.filter(p=>['Liquor Receipt','Beer Receipt','Food Receipt','Incident'].includes(p.tag)||S.photos.indexOf(p)<10).slice(0,10).map(p=>`
          <div class="pcard">
            ${p.url?`<img src="${p.url}" alt="${p.label}"/>`:'<div style="font-size:36px">📷</div>'}
            <div class="photo-overlay">
              <div class="photo-label">${p.label||p.tag}</div>
              <div class="photo-time">${p.tag}</div>
            </div>
          </div>
        `).join('')}
        ${S.photos.length===0?`<div class="empty-state" style="grid-column:span 2">No photos yet.<br/>Take your first photo above!</div>`:''}
      </div>
    `:''}

    ${S.tab==='staff-recipes'?`
      <div class="sec-title">🍹 ${L?'RECETAS':'RECIPE BOOK'}</div>
      ${renderRecipeBook(false)}
    `:''}

    ${S.tab==='staff-closeout'?`
      <div class="sec-title">✅ ${L?'CIERRE':'END OF NIGHT'}</div>
      <div class="card">
        <div class="ct">CLOSING CHECKLIST</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:12px">Complete all items before leaving</div>
        <div class="cprog"><div class="cbar" style="width:${pct}%"></div></div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:16px">${checkedCount}/${ALL_ITEMS.length} complete — ${pct}%</div>
        ${Object.entries(CHECKLIST_DATA).map(([group,items])=>`
          <div class="cgroup-t">${group}</div>
          ${items.map(item=>`<div class="citem" onclick="toggleCheck('${item.replace(/'/g,"\\'")}')">
            <div class="cbox ${S.checklist[item]?'done':''}">${S.checklist[item]?'<svg width="14" height="14" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#000" stroke-width="2.5" fill="none"/></svg>':''}</div>
            <span class="ctxt ${S.checklist[item]?'done':''}">${item}</span>
          </div>`).join('')}
        `).join('')}
        ${S.closeoutSubmitted?`<div class="success-box">✓ CLOSEOUT SUBMITTED!</div>`:`
          <button class="subbtn ${allDone?'ready':'locked'}" onclick="${allDone?'submitCloseout()':''}" ${allDone?'':'disabled'}>${allDone?(L?'ENVIAR CIERRE':'SUBMIT CLOSEOUT'):`${ALL_ITEMS.length-checkedCount} items remaining`}</button>
        `}
      </div>
    `:''}

    </main>
  </div>`;
}

function renderOwnerApp(){
  const L=S.lang==='es';
  const todaySales=S.sales[0]?(parseFloat(S.sales[0].bar_sales||0)+parseFloat(S.sales[0].food_sales||0)):0;
  const weekSales=S.sales.slice(0,7).reduce((a,s)=>a+(parseFloat(s.bar_sales||0)+parseFloat(s.food_sales||0)),0);
  const lowItems=S.inventory.filter(i=>i.stock<=(i.par_level*0.5)).length;
  const checkedCount=ALL_ITEMS.filter(i=>S.checklist[i]).length;
  const pct=Math.round((checkedCount/ALL_ITEMS.length)*100);
  const allDone=checkedCount===ALL_ITEMS.length;
  const openShifts=S.schedules.filter(s=>s.status==='open').length;
  const pendingBids=S.bids.filter(b=>b.status==='pending').length;
  const dayShifts=S.schedules.filter(s=>s.day_of_week===S.schedDay);

  const TABS=[
    {key:'dashboard',icon:'📊',label:'Home'},
    {key:'schedule',icon:'📅',label:'Sched',badge:openShifts+pendingBids},
    {key:'chat',icon:'💬',label:'Chat'},
    {key:'shift',icon:'⏰',label:'Shift'},
    {key:'inventory',icon:'📦',label:'Stock',badge:lowItems},
    {key:'gallery',icon:'📸',label:'Photos'},
    {key:'recipes',icon:'🍹',label:'Drinks'},
    {key:'closeout',icon:'✅',label:'Close'},
  ];

  return `<div class="app">
    <header class="hdr">
      <div><div class="hdr-logo">CantinaPro</div><div class="hdr-bar">${S.bar.name} · ${S.bar.location||''}</div></div>
      <div class="hdr-r">
        <div class="lang-wrap">
          <button class="lb ${!L?'on':''}" onclick="S.lang='en';render()">EN</button>
          <button class="lb ${L?'on':''}" onclick="S.lang='es';render()">ES</button>
        </div>
        <button class="logout-btn" onclick="logout()">OUT</button>
        <div class="sdot"></div>
      </div>
    </header>
    <nav class="top-nav" id="top-nav-owner">
      ${TABS.map(t=>`<button class="nb ${S.tab===t.key?'on':''}" data-tab-key="${t.key}" onclick="S.tab='${t.key}';render();if('${t.key}'==='chat')scrollChatToBottom()"><span class="ni">${t.icon}</span><span class="nl">${t.label}</span>${t.badge?`<span class="nbadge">${t.badge}</span>`:''}</button>`).join('')}
    </nav>
    <main class="main">

    ${S.showInstallBanner?`<div class="install-banner">
      <div style="font-size:22px">📱</div>
      <div style="flex:1"><div style="font-weight:700;font-size:16px;color:var(--text)">Install CantinaPro</div><div style="font-size:13px;color:var(--muted)">Add to your home screen for quick access</div></div>
      <button onclick="installApp()" class="btn-sm" style="background:var(--blue);color:#fff;font-size:13px;padding:9px 14px">INSTALL</button>
    </div>`:''}

    ${S.tab==='dashboard'?`
      <div class="sec-title">${L?'RESUMEN DE LA NOCHE':"TONIGHT'S OVERVIEW"}</div>
      <div class="kpi-grid">
        <div class="kpi lc"><div class="kl">${L?'Ventas Hoy':"Today's Sales"}</div><div class="kv">$${todaySales.toLocaleString()}</div><div class="kd">${S.sales.length} ${L?'entradas':'entries logged'}</div></div>
        <div class="kpi g"><div class="kl">${L?'Ingresos Semanales':'Weekly Revenue'}</div><div class="kv">$${weekSales.toLocaleString()}</div><div class="kd">${L?'Últimos 7 días':'Last 7 days'}</div></div>
        <div class="kpi b"><div class="kl">${L?'Empleados':'Staff'}</div><div class="kv">${S.staff.length}</div><div class="kd">${S.clockedIn.length} ${L?'adentro':'clocked in'}</div></div>
        <div class="kpi r"><div class="kl">${L?'Stock Bajo':'Low Stock'}</div><div class="kv">${lowItems}</div><div class="kd">${L?'Productos bajo el par':'Items below par'}</div></div>
      </div>
      ${openShifts>0?`<div class="open-banner"><div style="font-size:22px">⚠️</div><div><div style="font-weight:700;font-size:16px;color:var(--text)">${openShifts} ${L?(openShifts!==1?'Turnos Abiertos':'Turno Abierto'):'Open Shift'+(openShifts!==1?'s':'')}</div><div style="font-size:13px;color:var(--muted)">${L?'Se necesita personal — revisa el horario':'Staff needed — check Schedule'}</div></div><button class="btn-sm" style="background:var(--lc);color:#fff;margin-left:auto;font-size:13px;padding:9px 14px" onclick="S.tab='schedule';render()">${L?'VER':'VIEW'}</button></div>`:''}
      ${pendingBids>0?`<div style="background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:10px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px"><div style="font-size:22px">🙋</div><div><div style="font-weight:700;font-size:16px;color:var(--text)">${pendingBids} ${L?(pendingBids!==1?'Pujas Esperando':'Puja Esperando'):'Bid'+(pendingBids!==1?'s':'')+' Waiting'}</div><div style="font-size:13px;color:var(--muted)">${L?'El personal quiere cubrir turnos abiertos':'Staff want to cover open shifts'}</div></div><button class="btn-sm" style="background:var(--gold);color:#000;margin-left:auto;font-size:13px;padding:9px 14px" onclick="S.tab='schedule';render()">${L?'REVISAR':'REVIEW'}</button></div>`:''}

      <div class="card">
        <div class="ct">${L?'👤 LINK DEL PORTAL DEL STAFF':'👤 STAFF PORTAL LINK'}</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.6">${L?'Comparte este link con tu staff. Lo tocan, eligen su nombre, ponen su PIN y están adentro.':'Share this link with your staff. They tap it, pick their name, enter their PIN and they\'re in.'}</div>
        <div class="link-box">
          <div class="link-url">${getStaffLink()}</div>
          <button id="copy-link-btn" class="action-btn gold" style="margin-top:0" onclick="copyStaffLink()">${L?'📋 COPIAR LINK DEL STAFF':'📋 COPY STAFF LINK'}</button>
        </div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px;text-align:center">${L?'💡 El staff puede agregar al home screen como una app':'💡 Staff can also add to home screen to install as an app'}</div>
      </div>

      <button class="action-btn red" onclick="S.showSaleModal=true;render()" style="margin-bottom:14px">${L?'+ REGISTRAR VENTAS':'+ LOG SALES'}</button>
      <div class="card">
        <div class="ct">${L?'VENTAS RECIENTES':'RECENT SALES'}</div>
        ${S.sales.length===0?`<div class="empty-state">${L?'No hay ventas registradas todavía.<br/>Toca "Registrar Ventas" arriba.':'No sales logged yet.<br/>Tap "Log Sales" above.'}</div>`:
          S.sales.slice(0,5).map(s=>`<div class="row">
            <div style="flex:1">
              <div style="font-weight:700;font-size:17px;color:var(--text)">$${(parseFloat(s.bar_sales||0)+parseFloat(s.food_sales||0)).toLocaleString()}</div>
              <div style="font-size:13px;color:var(--muted)">${new Date(s.created_at).toLocaleDateString()} · ${s.submitted_by||'Manager'}</div>
            </div>
            <div style="font-size:13px;color:var(--muted);text-align:right">
              <div>Bar: $${parseFloat(s.bar_sales||0).toLocaleString()}</div>
              <div>Tips: $${parseFloat(s.tips||0).toLocaleString()}</div>
            </div>
          </div>`).join('')}
      </div>
    `:''}

    ${S.tab==='schedule'?`
      <div class="sec-title">📅 SCHEDULE</div>
      <div class="day-tabs">
        ${DAYS.map((d,i)=>{
          const hasOpen=S.schedules.some(s=>s.day_of_week===i&&s.status==='open');
          return `<button class="day-tab ${S.schedDay===i?'on':''} ${hasOpen&&S.schedDay!==i?'has-open':''}" onclick="S.schedDay=${i};render()">
            <div>${d}</div>${hasOpen?'<div style="font-size:8px;color:var(--red)">OPEN</div>':''}
          </button>`;
        }).join('')}
      </div>
      <button class="action-btn red" onclick="S.newShift.day_of_week=${S.schedDay};S.showShiftModal=true;render()" style="margin-bottom:14px">+ ADD SHIFT FOR ${DAYS[S.schedDay].toUpperCase()}</button>
      ${dayShifts.length===0?`<div class="empty-state">No shifts for ${DAYS[S.schedDay]}.<br/>Tap the button above to add one.</div>`:''}
      ${dayShifts.map(shift=>{
        const shiftBids=S.bids.filter(b=>b.shift_id===shift.id&&b.status==='pending');
        const staffIdx=S.staff.findIndex(s=>s.id===shift.staff_id);
        const color=staffIdx>=0?ac(staffIdx):'var(--muted)';
        return `<div class="shift-card ${shift.status==='open'?'open':shift.status==='covered'?'covered':''}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between">
            <div>
              <div class="shift-time">${shift.start_time} – ${shift.end_time}</div>
              <div class="shift-role">${shift.role||'Staff'}</div>
              <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
                ${shift.status!=='open'?`<div class="av" style="background:${color}22;color:${color};width:28px;height:28px;font-size:10px">${shift.staff_name?ai(shift.staff_name):'?'}</div>`:''}
                <span class="shift-badge ${shift.status}">${shift.status==='open'?'🔴 OPEN':shift.status==='covered'?'✅ COVERED':shift.staff_name}</span>
              </div>
              ${shift.dropped_by?`<div style="font-size:13px;color:var(--red);margin-top:6px">Dropped: ${shift.dropped_by}</div>`:''}
            </div>
            <div style="display:flex;gap:8px">
              ${shift.status==='scheduled'?`<button class="btn-sm" style="background:rgba(255,68,85,.2);color:var(--red);font-size:13px;padding:9px 12px" onclick="S.dropShiftId='${shift.id}';S.showDropModal=true;render()">DROP</button>`:''}
              <button class="btn-sm" style="background:rgba(255,68,85,.15);color:var(--red);font-size:18px;padding:6px 12px" onclick="deleteShift('${shift.id}')">×</button>
            </div>
          </div>
          ${shift.status==='open'&&S.staff.length>0?`
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
              <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px">AVAILABLE STAFF TO COVER</div>
              ${S.staff.map((st,i)=>{
                const hasBid=S.bids.find(b=>b.shift_id===shift.id&&b.staff_id===st.id);
                return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
                  <div class="av" style="background:${ac(i)}22;color:${ac(i)};width:28px;height:28px;font-size:10px">${ai(st.name)}</div>
                  <div style="flex:1;font-size:16px;font-weight:600;color:var(--text)">${st.name}</div>
                  ${hasBid?`<span style="font-size:13px;color:var(--gold)">BID PLACED ⏳</span>`:
                    `<button class="btn-sm" style="background:rgba(0,232,122,.2);color:var(--green);font-size:13px;padding:9px 12px" onclick="bidOnShift('${shift.id}','${st.id}','${st.name}')">ASSIGN</button>`}
                </div>`;
              }).join('')}
            </div>
          `:''}
          ${shiftBids.length>0?`
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
              <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:10px">🙋 ${shiftBids.length} BID${shiftBids.length!==1?'S':''} — APPROVE ONE</div>
              ${shiftBids.map(bid=>`<div class="bid-row">
                <div style="flex:1;font-size:16px;font-weight:600;color:var(--text)">${bid.staff_name}</div>
                <button class="btn-sm" style="background:rgba(0,232,122,.2);color:var(--green);margin-right:8px;font-size:13px;padding:9px 12px" onclick="approveBid('${bid.id}','${shift.id}','${bid.staff_id}','${bid.staff_name}')">✓ APPROVE</button>
                <button class="btn-sm" style="background:rgba(255,68,85,.2);color:var(--red);font-size:13px;padding:9px 10px" onclick="declineBid('${bid.id}')">✗</button>
              </div>`).join('')}
            </div>
          `:''}
        </div>`;
      }).join('')}

      ${S.showShiftModal?`<div class="modal-bg" onclick="S.showShiftModal=false;render()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-title">+ ADD SHIFT — ${DAYS[S.schedDay].toUpperCase()}</div>
          <div class="field"><label>Staff Member (optional — leave blank for open shift)</label>
            <select oninput="S.newShift.staff_id=this.value" style="background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:13px 14px;font-size:16px;width:100%;outline:none;-webkit-appearance:none;">
              <option value="">-- Open Shift (unassigned) --</option>
              ${S.staff.map(s=>`<option value="${s.id}" ${S.newShift.staff_id===s.id?'selected':''}>${s.name} · ${s.role}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Role / Position</label>
            <select oninput="S.newShift.role=this.value" style="background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:13px 14px;font-size:16px;width:100%;outline:none;-webkit-appearance:none;">
              ${ROLES.map(r=>`<option value="${r}" ${S.newShift.role===r?'selected':''}>${r}</option>`).join('')}
            </select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="field"><label>Start Time</label><input type="time" value="${S.newShift.start_time}" oninput="S.newShift.start_time=this.value" style="font-size:18px;"/></div>
            <div class="field"><label>End Time</label><input type="time" value="${S.newShift.end_time}" oninput="S.newShift.end_time=this.value" style="font-size:18px;"/></div>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="S.showShiftModal=false;render()">Cancel</button>
            <button class="btn-save" onclick="saveShift()">SAVE SHIFT</button>
          </div>
        </div>
      </div>`:''}

      ${S.showDropModal?`<div class="modal-bg" onclick="S.showDropModal=false;render()">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-title">DROP SHIFT</div>
          <div class="field"><label>Reason</label><input type="text" value="${S.dropReason}" oninput="S.dropReason=this.value" placeholder="Emergency, sick, etc."/></div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="S.showDropModal=false;render()">Cancel</button>
            <button class="btn-save" style="background:var(--red)" onclick="dropShift('${S.dropShiftId}')">DROP</button>
          </div>
        </div>
      </div>`:''}
    `:''}

    ${S.tab==='chat'?renderChat(true):''}

    ${S.tab==='shift'?`
      <div class="sec-title">⏰ SHIFT</div>
      <div class="clock-wrap"><div class="lct" id="clock-el">${S.liveTime||'--:--:--'}</div><div class="lcd">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} · ${S.bar.name}</div></div>
      <div class="card">
        <div class="ct">CLOCK IN / OUT</div>
        ${S.staff.length===0?`<div class="empty-state">No staff added yet.<br/>Tap "+ Add Staff" below.</div>`:''}
        <div class="staff-grid">
          ${S.staff.map((s,i)=>{

// ── RECIPE MANAGEMENT ─────────────────────────────────
S.recipes = [];
S.showRecipeModal = false;
S.editingRecipe = null;
S.newRecipe = {name:'',tag:'Signature',glass:'',prep_time:'2 min',cost:'',price:'',emoji:'🍹',ingredients:[{amount:'',name:'',note:''}],steps:['']};

async function loadRecipes(){
  if(!S.bar) return;
  const {data} = await db.from('recipes').select('*').eq('bar_id', S.bar.id).order('name');
  S.recipes = data || [];
}

async function saveRecipe(){
  if(!S.newRecipe.name || !S.bar) return;
  const recipe = {
    bar_id: S.bar.id,
    name: S.newRecipe.name,
    tag: S.newRecipe.tag,
    glass: S.newRecipe.glass,
    prep_time: S.newRecipe.prep_time,
    cost: parseFloat(S.newRecipe.cost)||0,
    price: parseFloat(S.newRecipe.price)||0,
    emoji: S.newRecipe.emoji||'🍹',
    ingredients: S.newRecipe.ingredients.filter(i=>i.name),
    steps: S.newRecipe.steps.filter(s=>s),
  };
  if(S.editingRecipe){
    await db.from('recipes').update(recipe).eq('id', S.editingRecipe);
    S.editingRecipe = null;
  } else {
    await db.from('recipes').insert(recipe);
  }
  S.newRecipe = {name:'',tag:'Signature',glass:'',prep_time:'2 min',cost:'',price:'',emoji:'🍹',ingredients:[{amount:'',name:'',note:''}],steps:['']};
  S.showRecipeModal = false;
  await loadRecipes();
  render();
}

async function deleteRecipe(id){
  if(!confirm('Delete this recipe?')) return;
  await db.from('recipes').delete().eq('id', id);
  await loadRecipes();
  render();
}

function getHiddenDefaults(){
  return Array.isArray(S.bar?.hidden_default_recipes)?S.bar.hidden_default_recipes:[];
}
async function hideDefaultRecipe(id){
  if(!S.bar)return;
  const current=getHiddenDefaults();
  if(current.includes(id))return;
  const updated=[...current,id];
  const{error}=await db.from('bars').update({hidden_default_recipes:updated}).eq('id',S.bar.id);
  if(error){alert('Could not hide recipe: '+error.message);return;}
  S.bar.hidden_default_recipes=updated;render();
}
async function unhideDefaultRecipe(id){
  if(!S.bar)return;
  const updated=getHiddenDefaults().filter(x=>x!==id);
  const{error}=await db.from('bars').update({hidden_default_recipes:updated}).eq('id',S.bar.id);
  if(error){alert('Could not restore recipe: '+error.message);return;}
  S.bar.hidden_default_recipes=updated;render();
}
async function hideAllDefaults(){
  if(!S.bar)return;
  if(!confirm('Hide all built-in recipes? You can restore them anytime.'))return;
  const allIds=['h1','h2','h3','h4'];
  const{error}=await db.from('bars').update({hidden_default_recipes:allIds}).eq('id',S.bar.id);
  if(error){alert('Could not hide recipes: '+error.message);return;}
  S.bar.hidden_default_recipes=allIds;render();
}
async function restoreAllDefaults(){
  if(!S.bar)return;
  const{error}=await db.from('bars').update({hidden_default_recipes:[]}).eq('id',S.bar.id);
  if(error){alert('Could not restore recipes: '+error.message);return;}
  S.bar.hidden_default_recipes=[];render();
}

function editRecipe(r){
  S.editingRecipe = r.id;
  S.newRecipe = {
    name: r.name, tag: r.tag||'Signature', glass: r.glass||'', prep_time: r.prep_time||'',
    cost: r.cost||'', price: r.price||'', emoji: r.emoji||'🍹',
    ingredients: r.ingredients&&r.ingredients.length ? r.ingredients : [{amount:'',name:'',note:''}],
    steps: r.steps&&r.steps.length ? r.steps : [''],
  };
  S.showRecipeModal = true;
  render();
}

function addIngredientRow(){ S.newRecipe.ingredients.push({amount:'',name:'',note:''});render(); }
function removeIngredientRow(i){ S.newRecipe.ingredients.splice(i,1);render(); }
function addStepRow(){ S.newRecipe.steps.push('');render(); }
function removeStepRow(i){ S.newRecipe.steps.splice(i,1);render(); }
function recipeMargin(cost,price){ return price>0?Math.round(((price-cost)/price)*100):0; }

function renderChat(isOwner){
  const L=S.lang==='es';
  const myName=isOwner?'Owner':(S.staffUser?S.staffUser.name:'?');
  const myId=isOwner?S.user?.id:S.staffUser?.id;
  const pinned=S.messages.filter(m=>m.pinned);
  const messages=S.messages.filter(m=>!m.pinned);

  let html=`
    <div class="sec-title">💬 ${L?'CHAT DEL EQUIPO':'TEAM CHAT'}</div>
    <div style="background:rgba(0,232,122,.08);border:1px solid rgba(0,232,122,.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px">
      <div style="width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;flex-shrink:0"></div>
      <div style="color:var(--text)"><strong>${L?'En vivo':'Live'}</strong> · ${L?'Mensajes aparecen al instante':'Messages appear instantly'}</div>
    </div>
  `;

  if(pinned.length>0){
    html+=`<div style="margin-bottom:14px">
      <div style="font-family:'Bebas Neue',cursive;font-size:12px;letter-spacing:2px;color:var(--lcg);margin-bottom:8px">📌 ${L?'ANUNCIOS':'PINNED'}</div>
      ${pinned.map(m=>renderMessageBubble(m,myId,isOwner,L,true)).join('')}
    </div>`;
  }

  html+=`
    <div id="chat-scroll" style="background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px;max-height:58vh;min-height:340px;overflow-y:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch">
      ${messages.length===0?`<div class="empty-state" style="padding:32px 8px">💬<br/>${L?'No hay mensajes todavía. Sé el primero!':'No messages yet. Be the first!'}</div>`:
        messages.map(m=>renderMessageBubble(m,myId,isOwner,L,false)).join('')}
    </div>

    <div style="background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:flex-end">
      <textarea id="chat-input" placeholder="${L?'Escribe un mensaje...':'Type a message...'}" rows="1" oninput="S.chatInput=this.value;this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}" style="background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 12px;font-size:15px;font-family:'Rajdhani',sans-serif;outline:none;flex:1;resize:none;line-height:1.4;max-height:120px;-webkit-appearance:none">${S.chatInput||''}</textarea>
      <button onclick="sendMessage()" style="background:linear-gradient(135deg,var(--lc),#a00020);border:none;color:#fff;border-radius:8px;width:46px;height:46px;flex-shrink:0;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;-webkit-appearance:none">▶</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center">${L?`Posteando como`:`Posting as`} <strong style="color:var(--lcg)">${myName}</strong>${isOwner?` · ${L?'Owner':'Owner'}`:''}</div>
  `;

  return html;
}

function renderMessageBubble(m,myId,isOwner,L,isPinnedSection){
  const isMine=m.sender_id===myId;
  const isFromOwner=m.is_owner;
  const time=new Date(m.created_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const dateStr=new Date(m.created_at).toLocaleDateString([],{month:'short',day:'numeric'});
  const senderColor=isFromOwner?'var(--lcg)':(isMine?'var(--lc)':'var(--blue)');
  const bgColor=isMine?'rgba(200,16,46,.12)':isFromOwner?'rgba(212,160,23,.08)':'var(--s2)';
  const borderColor=isMine?'rgba(200,16,46,.3)':isFromOwner?'rgba(212,160,23,.3)':'var(--border)';
  const align=isMine?'flex-end':'flex-start';
  const escapedTxt=(m.text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  return `<div style="display:flex;justify-content:${align};margin-bottom:10px">
    <div style="max-width:85%;background:${bgColor};border:1px solid ${borderColor};border-radius:12px;padding:10px 12px;position:relative">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div style="font-weight:700;font-size:13px;color:${senderColor}">${m.sender_name||'?'}${isFromOwner?' 👑':''}</div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted)">${dateStr} · ${time}</div>
      </div>
      <div style="font-size:15px;color:var(--text);line-height:1.45;word-wrap:break-word;white-space:pre-wrap">${escapedTxt}</div>
      ${isOwner?`<div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end">
        <button onclick="togglePin('${m.id}',${m.pinned})" style="background:${m.pinned?'rgba(212,160,23,.25)':'var(--s3)'};border:none;color:${m.pinned?'var(--lcg)':'var(--muted)'};border-radius:5px;padding:4px 9px;cursor:pointer;font-size:11px;font-family:'Bebas Neue',cursive;letter-spacing:1px">${m.pinned?'📌 UNPIN':'📌 PIN'}</button>
        <button onclick="deleteMessage('${m.id}')" style="background:rgba(255,68,85,.15);border:none;color:var(--red);border-radius:5px;padding:4px 9px;cursor:pointer;font-size:11px;font-family:'Bebas Neue',cursive;letter-spacing:1px">DEL</button>
      </div>`:''}
    </div>
  </div>`;
}

          </div>
        `).join('')}
        <button onclick="addStepRow()" style="background:var(--s2);border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:10px;cursor:pointer;font-size:14px;font-family:'Bebas Neue',cursive;letter-spacing:1px;width:100%;margin-bottom:6px">+ ADD STEP</button>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="S.showRecipeModal=false;S.editingRecipe=null;render()">Cancel</button>
          <button class="btn-save" onclick="saveRecipe()">${S.editingRecipe?'SAVE CHANGES':'ADD RECIPE'}</button>
        </div>
      </div>
    </div>`;
  }

  return html;
}

// Patch loadBar to also load recipes
const _origLoadBar = loadBar;
loadBar = async function(){
  await _origLoadBar();
  await loadRecipes();
};


init();
</script>
</body>
</html>
